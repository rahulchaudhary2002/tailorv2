services:
  tailor-postgres:
    image: postgres:16.2-alpine
    container_name: tailor-postgres
    restart: on-failure
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - tailor-postgres-data:/var/lib/postgresql/data
    networks:
      - tailor-services

  tailor-adminer:
    image: adminer:latest
    container_name: tailor-adminer
    depends_on:
      - tailor-postgres
    environment:
      ADMINER_DEFAULT_SERVER: tailor-postgres
    ports:
      - "8888:8080"
    networks:
      - tailor-services

  tailor-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: tailor
        uid: 1000
    image: tailor-app
    container_name: tailor-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./.dockerfile/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - tailor-postgres
    networks:
      - tailor-services

  tailor-webserver:
    image: nginx:alpine
    container_name: tailor-webserver
    restart: unless-stopped
    ports:
      - "8100:80"
      - "8143:443"
    volumes:
      - ./:/var/www
      - ./.dockerfile/nginx/conf.d:/etc/nginx/conf.d/
    depends_on:
      - tailor-app
    networks:
      - tailor-services

networks:
  tailor-services:
    driver: bridge

volumes:
  tailor-postgres-data:
